<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOURCE LOST 05</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }

  /* sound toggle, top right */
  #snd {
    position: fixed; top: max(16px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right)); z-index: 2;
    width: 52px; height: 52px; padding: 11px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.18); background: rgba(10,10,14,0.45);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    color: rgba(255,255,255,0.78); cursor: pointer;
    transition: transform .25s ease, background .25s ease, border-color .25s ease, color .25s ease, box-shadow .25s ease;
  }
  #snd svg { display: block; width: 100%; height: 100%; overflow: visible; }
  #snd .wave { fill: none; stroke: currentColor; stroke-width: 8; stroke-linecap: round;
               transition: opacity .3s ease, transform .3s ease; transform-origin: 56px 50px; }
  #snd .wave:nth-of-type(2) { transition-delay: .05s; }
  #snd .wave:nth-of-type(3) { transition-delay: .1s; }
  #snd.off .wave { opacity: 0; transform: scale(0.6); }
  #snd:hover, #snd:focus-visible {
    transform: scale(1.08); color: #fff; outline: none;
    background: rgba(120,255,175,0.18); border-color: rgba(120,255,175,0.7);
    box-shadow: 0 0 18px rgba(120,255,175,0.45), 0 0 34px rgba(120,255,175,0.2);
  }
  #snd:hover svg, #snd:focus-visible svg { filter: drop-shadow(0 0 4px rgba(120,255,175,0.9)); }
  #snd:not(.off):hover .wave { animation: ping 1.1s ease-in-out infinite; }
  #snd:not(.off):hover .wave:nth-of-type(2) { animation-delay: .15s; }
  #snd:not(.off):hover .wave:nth-of-type(3) { animation-delay: .3s; }
  #snd:active { transform: scale(0.96); }
  @keyframes ping { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
</style>
</head>
<body>
<button id="snd" class="off" type="button" aria-label="Sound on" aria-pressed="false">
  <svg viewBox="0 0 100 100" aria-hidden="true">
    <path fill="currentColor" d="M8 40a9 9 0 0 1 9-9h10l19-19a4 4 0 0 1 7 3v70a4 4 0 0 1-7 3L27 69H17a9 9 0 0 1-9-9z"/>
    <path class="wave" d="M63 40a13 13 0 0 1 0 20"/>
    <path class="wave" d="M71 28a28 28 0 0 1 0 44"/>
    <path class="wave" d="M80 16a44 44 0 0 1 0 68"/>
  </svg>
</button>
<canvas id="c"></canvas>
<script>
(() => {
  // XY oscilloscope: the word is reduced to its centre line and fed to the beam as
  // two signals, X(u) and Y(u). One beam, one continuous thick line. Interference on
  // the X/Y channels grows and fades, so the word dissolves and comes back.
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  const FONT = "'Helvetica Neue', Helvetica, Arial, sans-serif";
  const PHOSPHOR_FADE = 0.2;     // per-frame decay of the old trace
  const BEAM = [120, 255, 175];  // phosphor green
  const GRID_CELLS = 420;        // skeleton resolution across the width
  const CYCLE = 1;               // speed of the readable <-> unreadable cycle

  let W, H, dpr;
  let phos, pCtx;
  let N = 0, PX, PY, J;          // beam path (CSS px), J: beam jumped to reach this point
  let size = 100, cx = 0, cy = 0, step = 2;
  let RX, RY, SX, SY;            // per-frame scratch

  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
  const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

  // ---------- signal: word -> centre line -> one looped path ----------
  function buildPath() {
    const lines = W / H < 0.85 ? ['SOURCE', 'LOST'] : ['SOURCE LOST'];
    step = Math.max(1.5, W / GRID_CELLS);
    const gw = Math.ceil(W / step), gh = Math.ceil(H / step);
    const c = mk(gw, gh), x = c.getContext('2d');
    x.font = `700 100px ${FONT}`;
    if ('letterSpacing' in x) x.letterSpacing = '0.12em';
    const per100 = Math.max(...lines.map(l => x.measureText(l).width)) / 100;
    const s = Math.min((gw * 0.82) / per100, gh * 0.28);
    size = s * step;
    x.font = `700 ${s}px ${FONT}`;
    if ('letterSpacing' in x) x.letterSpacing = '0.12em';
    x.fillStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle';
    const lh = s * 1.1;
    lines.forEach((l, i) => x.fillText(l, gw / 2, gh / 2 + (i - (lines.length - 1) / 2) * lh));
    const d = x.getImageData(0, 0, gw, gh).data;
    const g = new Uint8Array(gw * gh);
    for (let i = 0; i < g.length; i++) g[i] = d[i * 4 + 3] > 127 ? 1 : 0;

    // Zhang-Suen thinning: strokes -> 1-cell centre lines
    const del = [];
    for (let changed = true; changed;) {
      changed = false;
      for (let pass = 0; pass < 2; pass++) {
        del.length = 0;
        for (let j = 1; j < gh - 1; j++) for (let i = 1; i < gw - 1; i++) {
          const k = j * gw + i;
          if (!g[k]) continue;
          const p2 = g[k - gw], p3 = g[k - gw + 1], p4 = g[k + 1], p5 = g[k + gw + 1],
                p6 = g[k + gw], p7 = g[k + gw - 1], p8 = g[k - 1], p9 = g[k - gw - 1];
          const B = p2 + p3 + p4 + p5 + p6 + p7 + p8 + p9;
          if (B < 2 || B > 6) continue;
          const A = (!p2 && p3) + (!p3 && p4) + (!p4 && p5) + (!p5 && p6) + (!p6 && p7) + (!p7 && p8) + (!p8 && p9) + (!p9 && p2);
          if (A !== 1) continue;
          if (pass === 0 ? (p2 * p4 * p6 || p4 * p6 * p8) : (p2 * p4 * p8 || p2 * p6 * p8)) continue;
          del.push(k);
        }
        if (del.length) { changed = true; for (const k of del) g[k] = 0; }
      }
    }

    const pts = [];
    for (let i = 0; i < gw; i++) for (let j = 0; j < gh; j++) if (g[j * gw + i]) pts.push([i, j]);   // column order: left first
    N = 0;
    if (!pts.length) return;

    // chain greedily: follow the stroke, jump to the nearest unvisited point when it ends
    const G = 6, cw = Math.ceil(gw / G), ch = Math.ceil(gh / G);
    const grid = Array.from({ length: cw * ch }, () => []);
    pts.forEach((p, k) => grid[(p[1] / G | 0) * cw + (p[0] / G | 0)].push(k));
    const used = new Uint8Array(pts.length);
    // stroke ends (one neighbour): after a jump, prefer landing on one so strokes aren't split in two
    const end = pts.map(([i, j]) => {
      let n = 0;
      for (let b = -1; b <= 1; b++) for (let a = -1; a <= 1; a++) if ((a || b) && g[(j + b) * gw + i + a]) n++;
      return n <= 1;
    });
    const nearest = (p) => {
      const gx = p[0] / G | 0, gy = p[1] / G | 0;
      let best = -1, bd = Infinity;
      for (let r = 0; r < Math.max(cw, ch); r++) {
        for (let yy = gy - r; yy <= gy + r; yy++) for (let xx = gx - r; xx <= gx + r; xx++) {
          if (xx < 0 || yy < 0 || xx >= cw || yy >= ch) continue;
          if (r && Math.abs(xx - gx) < r && Math.abs(yy - gy) < r) continue;
          for (const k of grid[yy * cw + xx]) {
            if (used[k]) continue;
            let dd = (pts[k][0] - p[0]) ** 2 + (pts[k][1] - p[1]) ** 2;
            if (dd > 2 && !end[k]) dd += 30;
            if (dd < bd) { bd = dd; best = k; }
          }
        }
        if (best >= 0 && bd <= (r * G) ** 2) return [best, bd];
      }
      return [best, bd];
    };
    const ox = [], oy = [], oj = [];
    let k = 0, jump = false;
    while (k >= 0) {
      used[k] = 1;
      ox.push(pts[k][0]); oy.push(pts[k][1]); oj.push(jump ? 1 : 0);
      const [nk, dd] = nearest(pts[k]);
      jump = dd > 2;
      k = nk;
    }

    // soften the pixel staircase inside each stroke
    N = ox.length;
    PX = new Float32Array(N); PY = new Float32Array(N); J = Uint8Array.from(oj);
    for (let i = 0; i < N; i++) {
      let sx = 0, sy = 0, n = 0;
      for (let o = -2; o <= 2; o++) {
        const q = i + o;
        if (q < 0 || q >= N) continue;
        if ((o < 0 && J[i + o + 1] && q < i) || (o > 0 && J[q])) continue;   // don't smooth across a jump
        sx += ox[q]; sy += oy[q]; n++;
      }
      PX[i] = (sx / n + 0.5) * step; PY[i] = (sy / n + 0.5) * step;
    }
    cx = W / 2; cy = H / 2;
    RX = new Float32Array(N); RY = new Float32Array(N);
    SX = new Float64Array(N + 1); SY = new Float64Array(N + 1);
    sound.event('setPath');
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    phos = mk(canvas.width, canvas.height); pCtx = phos.getContext('2d');
    pCtx.fillStyle = '#000'; pCtx.fillRect(0, 0, phos.width, phos.height);
    buildPath();
  }

  let burst = 0;
  canvas.addEventListener('pointerdown', () => { burst = 1.2; });

  // how badly the X/Y channels are disturbed right now: long clean stretches, then a storm
  function chaosAt(t) {
    const tt = t * CYCLE;
    const n = 0.5 + 0.5 * (0.55 * Math.sin(tt * 0.43) + 0.3 * Math.sin(tt * 0.171 + 2.1) + 0.15 * Math.sin(tt * 1.13 + 0.7));
    return smooth(0.42, 0.88, n);
  }

  // ---------- X(u), Y(u): path signal + interference ----------
  function signal(t, c) {
    const TAU = Math.PI * 2;
    const S = size;
    // amplitudes swell and shrink over time and along the line, so parts of the word survive
    const ripA = S * (0.006 + 0.07 * c) * (0.6 + 0.4 * Math.sin(t * 1.7));
    const ripF = 90 + 40 * Math.sin(t * 0.23);
    const midA = S * (0.004 + 0.32 * c * c) * (0.7 + 0.3 * Math.sin(t * 0.9 + 1));
    const lowA = S * 0.9 * c * c * c;
    const m = smooth(0.7, 1, c) * 0.85;                       // morph toward a bare Lissajous figure
    const la = 3, lb = 2, lph = t * 0.6;
    const lRx = Math.min(W * 0.36, size * 4), lRy = Math.min(H * 0.32, size * 1.6);
    const jit = 0.25 + 4 * c;
    for (let i = 0; i < N; i++) {
      const u = i / N;
      const loc = 0.5 + 0.5 * Math.sin(TAU * 2 * u + t * 0.8);
      let x = PX[i] + ripA * Math.sin(TAU * ripF * u + t * 23)
                    + midA * loc * Math.sin(TAU * 7 * u - t * 3.1)
                    + lowA * Math.sin(TAU * 1.5 * u + t * 0.7)
                    + (Math.random() - 0.5) * jit;
      let y = PY[i] + ripA * 0.8 * Math.cos(TAU * ripF * 1.31 * u - t * 19)
                    + midA * (1 - loc) * Math.sin(TAU * 5 * u + t * 2.3)
                    + lowA * 0.6 * Math.cos(TAU * 2 * u - t * 0.5)
                    + (Math.random() - 0.5) * jit;
      if (m > 0) {
        x += (cx + lRx * Math.sin(TAU * la * u + lph) - x) * m;
        y += (cy + lRy * Math.sin(TAU * lb * u) - y) * m;
      }
      RX[i] = x; RY[i] = y;
    }
    // limited bandwidth: the harder the storm, the more the corners melt
    const r = Math.round(c * c * 22);
    if (r > 0) {
      SX[0] = SY[0] = 0;
      for (let i = 0; i < N; i++) { SX[i + 1] = SX[i] + RX[i]; SY[i + 1] = SY[i] + RY[i]; }
      for (let i = r; i < N - r; i++) {
        RX[i] = (SX[i + r + 1] - SX[i - r]) / (2 * r + 1);
        RY[i] = (SY[i + r + 1] - SY[i - r]) / (2 * r + 1);
      }
    }
  }

  // ---------- frame ----------
  const LEVELS = [1, 0.45, 0.07, 0];   // last level: beam is blanked (long retrace jumps)
  const buckets = LEVELS.map(() => []);
  let last = performance.now(), start = last;
  function frame(ms) {
    const dt = Math.min(0.05, (ms - last) / 1000);
    last = ms;
    const t = (ms - start) / 1000;
    burst *= Math.pow(0.15, dt);
    const c = Math.min(1, chaosAt(t) + burst);
    sound.update(c, t);

    pCtx.globalCompositeOperation = 'source-over';
    pCtx.globalAlpha = 1;
    pCtx.fillStyle = `rgba(0,0,0,${Math.min(1, PHOSPHOR_FADE * dt * 60)})`;
    pCtx.fillRect(0, 0, phos.width, phos.height);

    if (N > 1) {
      signal(t, c);
      // a real beam leaves less light where it moves fast: long segments (jumps, storms) are dimmer
      for (const b of buckets) b.length = 0;
      const ref = step * 1.6;
      for (let i = 1; i <= N; i++) {
        const a = i - 1, b = i % N;
        const len = Math.hypot(RX[b] - RX[a], RY[b] - RY[a]) || 0.001;
        const e = ref / len;
        const lv = e > 0.8 ? 0 : e > 0.4 ? 1 : e > 0.25 ? 2 : 3;
        buckets[lv].push(a, b);
      }
      const flicker = 0.85 + 0.15 * Math.random();
      pCtx.globalCompositeOperation = 'lighter';
      pCtx.lineCap = 'round';
      pCtx.lineJoin = 'round';
      pCtx.lineWidth = Math.max(3, size * 0.075) * dpr;
      buckets.forEach((seg, lv) => {
        if (!seg.length || !LEVELS[lv]) return;
        pCtx.strokeStyle = `rgba(${BEAM},${0.32 * LEVELS[lv] * flicker})`;
        pCtx.beginPath();
        for (let s = 0; s < seg.length; s += 2) {
          pCtx.moveTo(RX[seg[s]] * dpr, RY[seg[s]] * dpr);
          pCtx.lineTo(RX[seg[s + 1]] * dpr, RY[seg[s + 1]] * dpr);
        }
        pCtx.stroke();
      });
      // hot core of the line
      pCtx.lineWidth = Math.max(1, size * 0.022) * dpr;
      pCtx.strokeStyle = `rgba(215,255,230,${0.18 * flicker})`;
      pCtx.beginPath();
      const seg = buckets[0];
      for (let s = 0; s < seg.length; s += 2) {
        pCtx.moveTo(RX[seg[s]] * dpr, RY[seg[s]] * dpr);
        pCtx.lineTo(RX[seg[s + 1]] * dpr, RY[seg[s + 1]] * dpr);
      }
      pCtx.stroke();
    }

    // ---- compose the CRT screen ----
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#020403';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // graticule
    ctx.strokeStyle = 'rgba(120,255,175,0.05)';
    ctx.lineWidth = dpr;
    const cell = Math.min(W, H) / 8 * dpr;
    ctx.beginPath();
    for (let x = canvas.width / 2 % cell; x < canvas.width; x += cell) { ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); }
    for (let y = canvas.height / 2 % cell; y < canvas.height; y += cell) { ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); }
    ctx.stroke();

    const fl = 0.92 + 0.08 * Math.random();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.9 * fl;
    ctx.filter = `blur(${10 * dpr}px)`;
    ctx.drawImage(phos, 0, 0);
    ctx.globalAlpha = 0.6 * fl;
    ctx.filter = `blur(${3 * dpr}px)`;
    ctx.drawImage(phos, 0, 0);
    ctx.filter = 'none';
    ctx.globalAlpha = fl;
    ctx.drawImage(phos, 0, 0);

    // scanlines + vignette
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 0.16;
    ctx.fillStyle = '#000';
    for (let y = 0; y < canvas.height; y += 3 * dpr) ctx.fillRect(0, y, canvas.width, dpr);
    ctx.globalAlpha = 1;
    const v = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, Math.min(canvas.width, canvas.height) * 0.3,
                                       canvas.width / 2, canvas.height / 2, Math.max(canvas.width, canvas.height) * 0.72);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(1, 'rgba(0,0,0,0.75)');
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    requestAnimationFrame(frame);
  }

  // ---------- sound: synthesised in the browser, toggled by the top-right button (or M) ----------
  function setupSound(build) {
    const btn = document.getElementById('snd');
    let ac = null, master = null, voice = null, on = false, nb = null;
    const kit = {
      get out() { return master; },
      noise() {
        if (!nb) {
          nb = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
          const d = nb.getChannelData(0);
          for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        }
        return nb;
      },
      // dry + synthetic-impulse reverb; returns the input node
      reverb(seconds, wet) {
        const len = ac.sampleRate * seconds | 0, ir = ac.createBuffer(2, len, ac.sampleRate);
        for (let ch = 0; ch < 2; ch++) {
          const d = ir.getChannelData(ch);
          for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
        }
        const cv = ac.createConvolver(); cv.buffer = ir;
        const input = ac.createGain();
        input.connect(master);
        input.connect(cv).connect(kit.gain(wet, master));
        return input;
      },
      gain(v, dest) { const g = ac.createGain(); g.gain.value = v; if (dest) g.connect(dest); return g; },
      filter(type, freq, q, dest) {
        const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
        if (dest) f.connect(dest);
        return f;
      },
      osc(type, freq, dest, detune = 0) {
        const o = ac.createOscillator(); o.type = type; o.frequency.value = freq; o.detune.value = detune;
        o.connect(dest); o.start();
        return o;
      },
      loopNoise(dest) {
        const n = ac.createBufferSource(); n.buffer = kit.noise(); n.loop = true;
        n.connect(dest); n.start();
        return n;
      },
      // one-shot tone gliding f0 -> f1
      blip(type, f0, f1, dur, vol, dest, attack = 0.004) {
        const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
        o.type = type;
        o.frequency.setValueAtTime(f0, t);
        o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + attack);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g).connect(dest);
        o.start(t); o.stop(t + dur + 0.05);
      },
      // one-shot filtered noise, filter sweeping f0 -> f1
      burst(dur, vol, type, f0, f1, q, dest, attack = 0.003) {
        const t = ac.currentTime, n = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
        n.buffer = kit.noise();
        f.type = type; f.Q.value = q;
        f.frequency.setValueAtTime(f0, t);
        f.frequency.exponentialRampToValueAtTime(f1, t + dur);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + attack);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        n.connect(f).connect(g).connect(dest);
        n.start(t, Math.random()); n.stop(t + dur + 0.05);
      },
    };
    function toggle() {
      if (!ac) {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        master = ac.createGain(); master.gain.value = 0;
        master.connect(ac.createDynamicsCompressor()).connect(ac.destination);
        voice = build(ac, kit);
      }
      on = !on;
      if (on) ac.resume();
      master.gain.setTargetAtTime(on ? 0.9 : 0, ac.currentTime, on ? 0.5 : 0.12);
      btn.classList.toggle('off', !on);
      btn.setAttribute('aria-pressed', String(on));
      btn.setAttribute('aria-label', on ? 'Sound off' : 'Sound on');
    }
    btn.addEventListener('click', toggle);
    btn.addEventListener('dblclick', e => e.stopPropagation());
    window.addEventListener('keydown', e => { if (e.key === 'm' || e.key === 'M') toggle(); });
    return {
      update(...a) { if (on && voice.update) voice.update(...a); },
      event(name, ...a) { if (on && voice[name]) voice[name](...a); },
    };
  }

  // what a real XY scope shows is audio: the word's path is played as a stereo signal
  // (left = X, right = Y). Interference adds noise, detunes it and fades in a 3:2 Lissajous tone.
  const sound = setupSound((ac, k) => {
    const lp = k.filter('lowpass', 4000, 0.5, k.gain(0.12, k.out));
    const wordG = k.gain(1, lp);
    const lissG = k.gain(0, lp);
    const merger = ac.createChannelMerger(2);
    merger.connect(lissG);
    const lx = ac.createOscillator(), ly = ac.createOscillator();
    lx.frequency.value = 165; ly.frequency.value = 110;
    lx.connect(merger, 0, 0); ly.connect(merger, 0, 1); lx.start(); ly.start();
    const noiseG = k.gain(0, k.filter('bandpass', 1500, 0.8, lp));
    k.loopNoise(noiseG);
    let src = null, baseRate = 1;
    function setPath() {
      if (src) { src.stop(); src.disconnect(); src = null; }
      if (N < 2) return;
      const buf = ac.createBuffer(2, N, ac.sampleRate);
      const L = buf.getChannelData(0), R = buf.getChannelData(1), s = Math.max(W, H) / 2;
      for (let i = 0; i < N; i++) { L[i] = (PX[i] - cx) / s; R[i] = -(PY[i] - cy) / s; }
      src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
      baseRate = 55 * N / ac.sampleRate;           // the whole word ~55 times a second
      src.playbackRate.value = baseRate;
      src.connect(wordG); src.start();
    }
    setPath();
    return {
      setPath,
      update(c, t) {
        const now = ac.currentTime;
        const m = Math.max(0, (c - 0.7) / 0.3);
        if (src) src.playbackRate.setTargetAtTime(baseRate * (1 + 0.25 * c * Math.sin(t * 3.1)), now, 0.05);
        lp.frequency.setTargetAtTime(4000 - 3200 * c * c, now, 0.05);
        noiseG.gain.setTargetAtTime(0.25 * c, now, 0.05);
        wordG.gain.setTargetAtTime(1 - 0.8 * m, now, 0.1);
        lissG.gain.setTargetAtTime(0.7 * m, now, 0.1);
      },
    };
  });

  let resizeQueued = false;
  const queueResize = () => {
    if (resizeQueued) return;
    resizeQueued = true;
    requestAnimationFrame(() => { resizeQueued = false; resize(); });
  };
  window.addEventListener('resize', queueResize);
  window.addEventListener('orientationchange', queueResize);

  const toggleFullscreen = () => {
    const el = document.documentElement;
    if (!document.fullscreenElement) (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el);
    else (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
  };
  canvas.addEventListener('dblclick', toggleFullscreen);
  window.addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F') toggleFullscreen(); });

  // debug hook: freeze the chaos level (e.g. window.__chaos = 0)
  const baseChaos = chaosAt;
  chaosAt = (t) => (window.__chaos ?? baseChaos(t));

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
