<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOURCE LOST 02</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }

  /* sound toggle, top right */
  #snd {
    position: fixed; top: max(16px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right)); z-index: 2;
    width: 52px; height: 52px; padding: 11px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.18); background: rgba(10,10,14,0.45);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    color: rgba(255,255,255,0.78); cursor: pointer;
    transition: transform .25s ease, background .25s ease, border-color .25s ease, color .25s ease, box-shadow .25s ease;
  }
  #snd svg { display: block; width: 100%; height: 100%; overflow: visible; }
  #snd .wave { fill: none; stroke: currentColor; stroke-width: 8; stroke-linecap: round;
               transition: opacity .3s ease, transform .3s ease; transform-origin: 56px 50px; }
  #snd .wave:nth-of-type(2) { transition-delay: .05s; }
  #snd .wave:nth-of-type(3) { transition-delay: .1s; }
  #snd.off .wave { opacity: 0; transform: scale(0.6); }
  #snd:hover, #snd:focus-visible {
    transform: scale(1.08); color: #fff; outline: none;
    background: rgba(230,230,240,0.18); border-color: rgba(230,230,240,0.7);
    box-shadow: 0 0 18px rgba(230,230,240,0.45), 0 0 34px rgba(230,230,240,0.2);
  }
  #snd:hover svg, #snd:focus-visible svg { filter: drop-shadow(0 0 4px rgba(230,230,240,0.9)); }
  #snd:not(.off):hover .wave { animation: ping 1.1s ease-in-out infinite; }
  #snd:not(.off):hover .wave:nth-of-type(2) { animation-delay: .15s; }
  #snd:not(.off):hover .wave:nth-of-type(3) { animation-delay: .3s; }
  #snd:active { transform: scale(0.96); }
  @keyframes ping { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
</style>
</head>
<body>
<button id="snd" class="off" type="button" aria-label="Sound on" aria-pressed="false">
  <svg viewBox="0 0 100 100" aria-hidden="true">
    <path fill="currentColor" d="M8 40a9 9 0 0 1 9-9h10l19-19a4 4 0 0 1 7 3v70a4 4 0 0 1-7 3L27 69H17a9 9 0 0 1-9-9z"/>
    <path class="wave" d="M63 40a13 13 0 0 1 0 20"/>
    <path class="wave" d="M71 28a28 28 0 0 1 0 44"/>
    <path class="wave" d="M80 16a44 44 0 0 1 0 68"/>
  </svg>
</button>
<canvas id="c"></canvas>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  const FONT = "'Helvetica Neue', Helvetica, Arial, sans-serif";
  const FIELD_PIXELS = 360000;   // pixel budget for the streak field buffer
  const BG = [7, 7, 8];
  const FIELD_DIM = 0.5;         // overall streak brightness; lower = darker background

  // streak palette: [r, g, b, weight]
  const PALETTE = [
    [40, 230, 250, 0.3],    // cyan
    [30, 130, 235, 0.16],   // blue
    [20, 50, 120, 0.08],    // navy
    [245, 35, 25, 0.18],    // red
    [255, 135, 55, 0.12],   // orange
    [235, 245, 250, 0.08],  // white
    [150, 60, 200, 0.04],   // violet
    [120, 15, 20, 0.04],    // dark red
  ];
  const PAL_SUM = PALETTE.reduce((s, p) => s + p[3], 0);

  let W, H, dpr;
  let layout;
  let tint = {};
  let textComp, tcCtx, frameBuf, fbCtx, shadow;
  let field, fCtx, fImg, fU32, fW, fH, S;
  let cols, runs;                // per-column streak properties, grouped into runs
  let textCov;                   // text coverage per field column (0..1)
  let bands;                     // dark horizontal tear bands
  let grainPat = [], grainCanvas;

  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);

  // smooth 1D noise table (vertical streak variation) + raw hash table (speckle)
  const NT = new Float32Array(4096);
  {
    let a = Float32Array.from({ length: 4096 }, () => Math.random());
    for (let pass = 0; pass < 3; pass++) {
      const b = new Float32Array(4096);
      for (let i = 0; i < 4096; i++) {
        let s = 0;
        for (let k = -5; k <= 5; k++) s += a[(i + k) & 4095];
        b[i] = s / 11;
      }
      a = b;
    }
    let lo = 1, hi = 0;
    for (const v of a) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
    for (let i = 0; i < 4096; i++) NT[i] = (a[i] - lo) / (hi - lo);
  }
  const RT = Float32Array.from({ length: 65536 }, () => Math.random());

  function pickColor() {
    let r = Math.random() * PAL_SUM;
    for (const p of PALETTE) { if ((r -= p[3]) <= 0) return p; }
    return PALETTE[0];
  }

  function newRun(x0) {
    const u = (x0 - layout.fx0) / (layout.fx1 - layout.fx0);
    const inside = u >= 0 && u <= 1;
    const edge = Math.min(u, 1 - u);
    const p = pickColor();
    const dark = Math.random() < 0.13;
    return {
      alive: inside && Math.random() < (edge < 0.05 ? 0.45 : 0.94),
      r: p[0], g: p[1], b: p[2],
      I: dark ? 0.1 : 0.7 + Math.random() * 0.4,
      top: Math.random() < 0.55 ? Math.random() * 0.22 : 0.18 + Math.random() * 0.25,
      bottom: Math.random() < 0.85 ? 1.02 : 0.8 + Math.random() * 0.2,
      phase: Math.random() * 4096,
      step: 0.15 + Math.random() * 1.6,
      speed: (Math.random() < 0.6 ? 1 : -1) * (8 + Math.random() * 60),
      frag: Math.random(),
    };
  }

  function buildColumns() {
    cols = new Array(fW);
    runs = [];
    let x = 0;
    while (x < fW) {
      const len = 1 + (Math.random() * Math.random() * 7 | 0);
      const run = { x, len, p: newRun(x) };
      runs.push(run);
      for (let k = 0; k < len && x + k < fW; k++) cols[x + k] = run.p;
      x += len;
    }
  }

  function rerollRuns(frac) {
    for (const run of runs) {
      if (Math.random() > frac) continue;
      run.p = newRun(run.x);
      for (let k = 0; k < run.len && run.x + k < fW; k++) cols[run.x + k] = run.p;
    }
  }

  function buildBands() {
    bands = [
      { c: 0.18, h: 0.045, x0: 0.42, x1: 1, d: 0.85 },
      { c: 0.585, h: 0.035, x0: 0, x1: 1, d: 0.9 },
      { c: 0.8, h: 0.03, x0: 0, x1: 0.95, d: 0.88 },
    ];
  }

  // ---------- setup ----------
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    const tw = canvas.width, th = canvas.height;

    // text: one line on wide screens, two lines in portrait
    const lines = W / H < 0.85 ? ['SOURCE', 'LOST'] : ['SOURCE LOST'];
    const probe = mk(1, 1).getContext('2d');
    probe.font = `800 100px ${FONT}`;
    if ('letterSpacing' in probe) probe.letterSpacing = '0.04em';
    const per100 = Math.max(...lines.map(l => probe.measureText(l).width)) / 100;
    const textW = Math.min(W * 0.82, H * (lines.length > 1 ? 0.75 : 1.0));
    const size = Math.min(textW / per100, H * 0.2);
    const lineH = size * 1.0;
    const blockH = lineH * lines.length;
    const ty = H * 0.5 - blockH / 2 + size * 0.86;   // first baseline
    const realW = per100 * size;
    layout = {
      lines, size, lineH, ty, textW: realW,
      top: ty - size * 0.86, bottom: ty + lineH * (lines.length - 1) + size * 0.08,
      cx: W / 2,
    };

    // white text mask
    const mask = mk(tw, th), m = mask.getContext('2d');
    m.setTransform(dpr, 0, 0, dpr, 0, 0);
    m.fillStyle = '#fff'; m.textAlign = 'center'; m.textBaseline = 'alphabetic';
    m.font = `800 ${size}px ${FONT}`;
    if ('letterSpacing' in m) m.letterSpacing = '0.04em';
    lines.forEach((l, i) => m.fillText(l, layout.cx, ty + i * lineH));

    // tinted channel layers
    for (const [k, col] of [['r', '#ff2050'], ['g', '#30ffd0'], ['b', '#4050ff'], ['w', '#ffffff']]) {
      const c = mk(tw, th), x = c.getContext('2d');
      x.drawImage(mask, 0, 0);
      x.globalCompositeOperation = 'source-in';
      x.fillStyle = col; x.fillRect(0, 0, tw, th);
      tint[k] = c;
    }
    // soft dark backing so the letters read against the bright streaks
    shadow = mk(tw, th);
    const shx = shadow.getContext('2d');
    shx.filter = `blur(${size * 0.08 * dpr}px)`;
    shx.drawImage(mask, 0, 0);
    shx.filter = 'none';
    shx.globalCompositeOperation = 'source-in';
    shx.fillStyle = '#000'; shx.fillRect(0, 0, tw, th);

    textComp = mk(tw, th); tcCtx = textComp.getContext('2d');
    frameBuf = mk(tw, th); fbCtx = frameBuf.getContext('2d');

    // streak field buffer
    S = Math.min(0.5, Math.sqrt(FIELD_PIXELS / (W * H)));
    fW = Math.ceil(W * S); fH = Math.ceil(H * S);
    field = mk(fW, fH); fCtx = field.getContext('2d');
    fImg = fCtx.createImageData(fW, fH);
    fU32 = new Uint32Array(fImg.data.buffer);
    const half = Math.max(realW * 1.04, Math.min(W * 0.9, H * 0.9)) / 2;
    layout.fx0 = (layout.cx - half) * S;
    layout.fx1 = (layout.cx + half) * S;

    // per-column text coverage, sampled from the mask at field resolution
    const small = mk(fW, fH), sx = small.getContext('2d');
    sx.drawImage(mask, 0, 0, fW, fH);
    const sd = sx.getImageData(0, 0, fW, fH).data;
    textCov = new Float32Array(fW);
    const y0 = Math.floor(layout.top * S), y1 = Math.ceil(layout.bottom * S);
    for (let x = 0; x < fW; x++) {
      let s = 0;
      for (let y = y0; y < y1; y++) s += sd[(y * fW + x) * 4 + 3];
      textCov[x] = clamp(s / 255 / Math.max(1, (y1 - y0) * 0.35), 0, 1);
    }

    buildColumns();
    buildBands();

    // grain
    grainPat = [];
    for (let i = 0; i < 6; i++) {
      const g = mk(256, 256), gx = g.getContext('2d'), id = gx.createImageData(256, 256);
      for (let p = 0; p < id.data.length; p += 4) {
        const v = Math.random() * 255;
        id.data[p] = id.data[p + 1] = id.data[p + 2] = v;
        id.data[p + 3] = Math.random() < 0.55 ? 255 : 0;
      }
      gx.putImageData(id, 0, 0);
      if (i === 0) grainCanvas = g;
      grainPat.push(ctx.createPattern(g, 'repeat'));
    }
  }

  // ---------- streak field ----------
  const bandF = new Float32Array(4096);
  function renderField(t, seed) {
    const bg = (255 << 24) | (BG[2] << 16) | (BG[1] << 8) | BG[0];
    fU32.fill(bg);

    // dark tear bands, drifting slightly
    const textTopF = layout.top * S;
    const textMidF = (layout.top + layout.bottom) / 2 * S;
    const tSig = (layout.bottom - layout.top) * S * 1.6;

    for (let x = 0; x < fW; x++) {
      const c = cols[x];
      if (!c || !c.alive) continue;
      const ux = x / fW;
      for (let y = 0; y < fH; y++) bandF[y] = 1;
      for (const b of bands) {
        if (ux < b.x0 || ux > b.x1) continue;
        const bc = (b.c + Math.sin(t * 0.3 + b.c * 10) * 0.004) * fH, bh = b.h * fH;
        const ya = Math.max(0, bc - bh / 2 | 0), yb = Math.min(fH, bc + bh / 2 | 0);
        for (let y = ya; y < yb; y++) bandF[y] = (y & 1) ? 1 - b.d : 1 - b.d * 0.7;
      }

      const yTop = c.top * fH, yBot = Math.min(fH, c.bottom * fH);
      const tw = textCov[x];
      const off = c.phase - t * c.speed * c.step;
      const xr = (x * 977 + seed) & 65535;

      for (let y = Math.max(0, yTop | 0); y < yBot; y++) {
        const s = RT[(xr + y * 131) & 65535];
        // ragged top edge
        if (y < yTop + 24 && s < 1 - (y - yTop) / 24) continue;
        // above the text the streaks break up into fragments
        if (y < textTopF) {
          const frag = (0.08 + 0.55 * c.frag) * (1 - y / textTopF);
          if (s < frag) continue;
        }
        let v = NT[((off + y * c.step) | 0) & 4095];
        v = c.I * (0.5 + 0.85 * v);
        if (s < 0.035) v *= 0.15;          // dark specks
        else if (s > 0.985) v = 1.1;       // hot pixels
        const bf = bandF[y];
        if (bf < 1) v = v * bf + (s > 0.93 ? 0.5 : 0);

        // letters bleed white light up and down their columns
        const dy = (y - textMidF) / tSig;
        const near = Math.exp(-dy * dy);
        const w = tw * near * 0.35;
        // dim the whole field, and a bit more around the text so the letters read clearly
        v *= FIELD_DIM * (1 - 0.35 * near);

        let r = c.r * v, g = c.g * v, b = c.b * v;
        r += (255 * v - r) * w; g += (255 * v - g) * w; b += (255 * v - b) * w;
        r = r > 255 ? 255 : r; g = g > 255 ? 255 : g; b = b > 255 ? 255 : b;
        fU32[y * fW + x] = (255 << 24) | (b << 16) | (g << 8) | r;
      }
    }
    fCtx.putImageData(fImg, 0, 0);
  }

  // ---------- glitch state ----------
  let glitch = 0, strips = [], dashes = [], dashTimer = 0, blocks = [];
  canvas.addEventListener('pointerdown', () => { glitch = 1.6; rerollRuns(0.3); });

  function makeStrips() {
    strips = [];
    let yy = 0;
    while (yy < H) {
      const sh = 2 + Math.random() * 40;
      strips.push({ y: yy, h: sh, dx: Math.random() < 0.3 ? (Math.random() - 0.5) * 110 * glitch : 0 });
      yy += sh;
    }
  }

  function makeBlocks() {
    blocks = [];
    const n = 2 + (Math.random() * 5 | 0);
    for (let i = 0; i < n; i++) {
      const w = rnd(40, W * 0.35), h = rnd(4, 40);
      blocks.push({ x: rnd(W - w), y: rnd(H - h), w, h, dx: rnd(-80, 80), dy: rnd(-20, 20) });
    }
  }

  function makeDashes() {
    dashes = [];
    const n = 60 + (glitch * 60 | 0);
    for (let i = 0; i < n; i++) {
      // mostly upper-left and around the field edges, like stray sorted pixels
      const r = Math.random();
      let x, y;
      if (r < 0.45) { x = rnd(W * 0.05, W * 0.45); y = rnd(H * 0.02, H * 0.42); }
      else if (r < 0.7) { x = rnd(layout.fx0 / S - 60, layout.fx0 / S + 40); y = rnd(H); }
      else if (r < 0.9) { x = rnd(layout.fx1 / S - 40, layout.fx1 / S + 70); y = rnd(H); }
      else { x = rnd(W); y = rnd(H); }
      dashes.push({
        x, y, w: rnd(2, 36), h: Math.random() < 0.85 ? 1 : 2,
        c: ['#fff', '#fff', '#fff', '#ff3a20', '#30e8ff', '#ff8a40'][Math.random() * 6 | 0],
        a: rnd(0.3, 0.95),
      });
    }
  }

  // ---------- frame ----------
  let start = performance.now(), frameN = 0, seed = 0, rerollT = 0;
  function frame(now) {
    const t = (now - start) / 1000;
    frameN++;

    if (Math.random() < 0.015) { glitch = Math.max(glitch, 0.5 + Math.random() * 0.8); rerollRuns(0.12); }
    glitch *= 0.9;
    sound.update(glitch, t);
    if (frameN % 3 === 0) seed = (Math.random() * 65536) | 0;
    if (t - rerollT > 0.35) { rerollRuns(0.03); rerollT = t; }
    if (Math.random() < 0.01) bands[(Math.random() * bands.length) | 0].c = rnd(0.12, 0.88);

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = `rgb(${BG})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // streak field, kept crisp horizontally
    renderField(t, seed);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(field, 0, 0, canvas.width, canvas.height);
    ctx.imageSmoothingEnabled = true;

    // RGB-split, grainy text
    const o = (3 + 2 * Math.sin(t * 2.3) + glitch * 16 + (Math.random() - 0.5) * glitch * 8) * dpr;
    tcCtx.globalCompositeOperation = 'source-over';
    tcCtx.globalAlpha = 1;
    tcCtx.clearRect(0, 0, textComp.width, textComp.height);
    tcCtx.globalCompositeOperation = 'lighter';
    tcCtx.globalAlpha = 0.85;
    tcCtx.drawImage(tint.r, o, o * 0.2);
    tcCtx.drawImage(tint.g, -o, -o * 0.25);
    tcCtx.drawImage(tint.b, -o * 0.4, o * 0.5);
    tcCtx.globalAlpha = 1;
    tcCtx.globalCompositeOperation = 'source-over';
    tcCtx.drawImage(tint.w, 0, 0);
    tcCtx.globalCompositeOperation = 'destination-out';
    tcCtx.globalAlpha = 0.45;
    tcCtx.setTransform(1, 0, 0, 1, Math.random() * 256, Math.random() * 256);
    tcCtx.fillStyle = grainPat[frameN % grainPat.length];
    tcCtx.fillRect(-256, -256, textComp.width + 512, textComp.height + 512);
    tcCtx.setTransform(1, 0, 0, 1, 0, 0);
    tcCtx.globalAlpha = 1;

    ctx.globalAlpha = 0.85;
    ctx.drawImage(shadow, 0, 0);
    ctx.drawImage(shadow, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.3;
    ctx.filter = `blur(${10 * dpr}px)`;
    ctx.drawImage(textComp, 0, 0);
    ctx.filter = 'none';
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(textComp, 0, 0);
    // vertical smear ghosts of the letters
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.12;
    ctx.drawImage(textComp, 0, -10 * dpr);
    ctx.drawImage(textComp, 0, 14 * dpr);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    // full-frame glitch: displaced strips with colour fringe + corrupted blocks
    if (glitch > 0.08) {
      if (Math.random() < 0.5) makeStrips();
      if (Math.random() < 0.3) makeBlocks();
      fbCtx.globalCompositeOperation = 'copy';
      fbCtx.drawImage(canvas, 0, 0);
      ctx.fillStyle = `rgb(${BG})`;
      for (const s of strips) {
        if (!s.dx) continue;
        const sy = s.y * dpr, sh = s.h * dpr;
        ctx.fillRect(0, sy, canvas.width, sh);
        ctx.drawImage(frameBuf, 0, sy, canvas.width, sh, s.dx * dpr, sy, canvas.width, sh);
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 0.35 * Math.min(1, glitch);
        ctx.fillStyle = s.dx > 0 ? '#ff1030' : '#10e0ff';
        ctx.fillRect(s.dx > 0 ? 0 : canvas.width + s.dx * dpr, sy, Math.abs(s.dx) * dpr, sh);
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = `rgb(${BG})`;
      }
      for (const b of blocks) {
        ctx.drawImage(frameBuf, b.x * dpr, b.y * dpr, b.w * dpr, b.h * dpr,
                      (b.x + b.dx) * dpr, (b.y + b.dy) * dpr, b.w * dpr, b.h * dpr);
      }
    }

    // stray sorted-pixel dashes
    if (--dashTimer <= 0) { makeDashes(); dashTimer = 2 + Math.random() * 6 | 0; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    for (const d of dashes) {
      ctx.globalAlpha = d.a * (0.4 + 0.6 * Math.random());
      ctx.fillStyle = d.c;
      ctx.fillRect(d.x + (Math.random() - 0.5) * 3, d.y, d.w, d.h);
    }
    ctx.globalAlpha = 1;

    // heavy film grain
    ctx.setTransform(1, 0, 0, 1, Math.random() * 256, Math.random() * 256);
    ctx.fillStyle = grainPat[(frameN >> 1) % grainPat.length];
    ctx.globalCompositeOperation = 'overlay';
    ctx.globalAlpha = 0.12;
    ctx.fillRect(-256, -256, canvas.width + 512, canvas.height + 512);
    ctx.globalCompositeOperation = 'screen';
    ctx.globalAlpha = 0.05;
    ctx.fillRect(-256, -256, canvas.width + 512, canvas.height + 512);
    ctx.globalCompositeOperation = 'source-over';

    // vignette
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    const v = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, Math.min(canvas.width, canvas.height) * 0.35,
                                       canvas.width / 2, canvas.height / 2, Math.max(canvas.width, canvas.height) * 0.75);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(1, 'rgba(0,0,0,0.35)');
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    requestAnimationFrame(frame);
  }

  // rebuild once per frame at most while the window is being resized
  // ---------- sound: synthesised in the browser, toggled by the top-right button (or M) ----------
  function setupSound(build) {
    const btn = document.getElementById('snd');
    let ac = null, master = null, voice = null, on = false, nb = null;
    const kit = {
      get out() { return master; },
      noise() {
        if (!nb) {
          nb = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
          const d = nb.getChannelData(0);
          for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        }
        return nb;
      },
      // dry + synthetic-impulse reverb; returns the input node
      reverb(seconds, wet) {
        const len = ac.sampleRate * seconds | 0, ir = ac.createBuffer(2, len, ac.sampleRate);
        for (let ch = 0; ch < 2; ch++) {
          const d = ir.getChannelData(ch);
          for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
        }
        const cv = ac.createConvolver(); cv.buffer = ir;
        const input = ac.createGain();
        input.connect(master);
        input.connect(cv).connect(kit.gain(wet, master));
        return input;
      },
      gain(v, dest) { const g = ac.createGain(); g.gain.value = v; if (dest) g.connect(dest); return g; },
      filter(type, freq, q, dest) {
        const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
        if (dest) f.connect(dest);
        return f;
      },
      osc(type, freq, dest, detune = 0) {
        const o = ac.createOscillator(); o.type = type; o.frequency.value = freq; o.detune.value = detune;
        o.connect(dest); o.start();
        return o;
      },
      loopNoise(dest) {
        const n = ac.createBufferSource(); n.buffer = kit.noise(); n.loop = true;
        n.connect(dest); n.start();
        return n;
      },
      // one-shot tone gliding f0 -> f1
      blip(type, f0, f1, dur, vol, dest, attack = 0.004) {
        const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
        o.type = type;
        o.frequency.setValueAtTime(f0, t);
        o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + attack);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g).connect(dest);
        o.start(t); o.stop(t + dur + 0.05);
      },
      // one-shot filtered noise, filter sweeping f0 -> f1
      burst(dur, vol, type, f0, f1, q, dest, attack = 0.003) {
        const t = ac.currentTime, n = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
        n.buffer = kit.noise();
        f.type = type; f.Q.value = q;
        f.frequency.setValueAtTime(f0, t);
        f.frequency.exponentialRampToValueAtTime(f1, t + dur);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + attack);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        n.connect(f).connect(g).connect(dest);
        n.start(t, Math.random()); n.stop(t + dur + 0.05);
      },
    };
    function toggle() {
      if (!ac) {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        master = ac.createGain(); master.gain.value = 0;
        master.connect(ac.createDynamicsCompressor()).connect(ac.destination);
        voice = build(ac, kit);
      }
      on = !on;
      if (on) ac.resume();
      master.gain.setTargetAtTime(on ? 0.9 : 0, ac.currentTime, on ? 0.5 : 0.12);
      btn.classList.toggle('off', !on);
      btn.setAttribute('aria-pressed', String(on));
      btn.setAttribute('aria-label', on ? 'Sound off' : 'Sound on');
    }
    btn.addEventListener('click', toggle);
    btn.addEventListener('dblclick', e => e.stopPropagation());
    window.addEventListener('keydown', e => { if (e.key === 'm' || e.key === 'M') toggle(); });
    return {
      update(...a) { if (on && voice.update) voice.update(...a); },
      event(name, ...a) { if (on && voice[name]) voice[name](...a); },
    };
  }

  // a broken transmission: mains hum, static that flares with glitches, modem-like data chatter
  const sound = setupSound((ac, k) => {
    const bus = k.reverb(1.6, 0.3);
    k.osc('sawtooth', 50, k.filter('lowpass', 380, 1, k.gain(0.06, bus)));
    const staticG = k.gain(0.012, bus);
    k.loopNoise(k.filter('highpass', 2500, 0.7, staticG));
    const dataG = k.gain(0, k.filter('bandpass', 1800, 0.8, bus));
    const dataO = k.osc('square', 1200, dataG);
    const TONES = [600, 1200, 1800, 2400, 3000];
    let nextBit = 0, thumped = false;
    return {
      update(glitch, t) {
        const now = ac.currentTime;
        if (t > nextBit) {
          nextBit = t + (0.03 + Math.random() * 0.09) / (1 + glitch * 3);
          dataO.frequency.setValueAtTime(TONES[Math.random() * TONES.length | 0], now);
          dataG.gain.setValueAtTime(Math.random() < 0.6 ? 0.02 + glitch * 0.04 : 0, now);
        }
        staticG.gain.setTargetAtTime(0.012 + glitch * 0.18, now, 0.02);
        if (glitch > 1.35 && !thumped) {
          thumped = true;
          k.blip('sine', 110, 38, 0.6, 0.5, bus);
          k.burst(0.25, 0.25, 'lowpass', 4000, 300, 0.7, bus);
        }
        if (glitch < 0.5) thumped = false;
      },
    };
  });

  let resizeQueued = false;
  const queueResize = () => {
    if (resizeQueued) return;
    resizeQueued = true;
    requestAnimationFrame(() => { resizeQueued = false; resize(); });
  };
  window.addEventListener('resize', queueResize);
  window.addEventListener('orientationchange', queueResize);

  // double-click or "F" toggles true browser fullscreen
  const toggleFullscreen = () => {
    const el = document.documentElement;
    if (!document.fullscreenElement) (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el);
    else (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
  };
  canvas.addEventListener('dblclick', toggleFullscreen);
  window.addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F') toggleFullscreen(); });

  resize();
  start = performance.now();
  requestAnimationFrame(frame);
})();
</script>
